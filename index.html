<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Photo Log Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Photo Log Editor</h1>
          <p id="statusText">No photos imported</p>
        </div>
      </header>

      <main>
        <section id="importScreen" class="screen active">
          <div id="dropZone" class="import-panel">
            <input id="fileInput" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple />
            <div class="import-copy">
              <span class="import-icon">+</span>
              <h2>Import photos</h2>
              <p>Choose up to 9 JPG, PNG, WebP, HEIC, or HEIF images for this session.</p>
              <button id="chooseFilesBtn" class="primary-btn">Choose Photos</button>
            </div>
          </div>
        </section>

        <section id="galleryScreen" class="screen">
          <div class="workspace-actions bottom-actions">
            <button id="addMoreBtn">Add Photos</button>
            <button id="editSelectedBtn" class="primary-btn">Edit Selected</button>
            <button id="goStitchBtn">Skip To Stitch</button>
            <button id="clearBtn" class="danger-btn">Clear Session</button>
          </div>
          <div class="selection-line">
            <strong id="photoCount">0 photos</strong>
            <span id="selectedCount">0 selected for text</span>
          </div>
          <div id="gallery" class="gallery" aria-live="polite"></div>
        </section>

        <section id="editorScreen" class="screen editor-screen">
          <div class="editor-toolbar">
            <span id="editorPosition">0 / 0</span>
          </div>

          <div class="editor-layout">
            <div id="canvasWrap" class="canvas-wrap">
              <button id="prevPhotoBtn" class="image-nav prev" aria-label="Previous photo">Previous</button>
              <canvas id="photoCanvas"></canvas>
              <button id="nextPhotoBtn" class="image-nav next" aria-label="Next photo">Next</button>
            </div>

            <aside class="text-panel">
              <button id="addTextBtn" class="primary-btn wide">Add</button>

              <label class="field-label" for="fontSize">Font size</label>
              <div class="range-row">
                <input id="fontSize" type="range" min="2" max="12" value="5" step="0.2" />
                <span id="fontSizeValue">5%</span>
              </div>

              <div class="field-label">Text color</div>
              <div id="colorControls" class="swatches"></div>

              <div class="field-label">Background</div>
              <div id="backgroundControls" class="segmented">
                <button data-bg="none" class="active">None</button>
                <button data-bg="white">White</button>
                <button data-bg="black">Black</button>
              </div>

              <button id="deleteTextBtn" class="danger-btn wide">Delete Text Box</button>
              <button id="finishEditingBtn" class="wide">Continue To Stitch</button>
            </aside>
          </div>
        </section>

        <section id="stitchScreen" class="screen">
          <div class="selection-line">
            <strong id="stitchCount">0 images</strong>
            <span>Drag to reorder all uploaded images before downloading.</span>
          </div>
          <div id="stitchList" class="stitch-list"></div>
          <div class="stitch-download">
            <button id="exportStitchBtn" class="primary-btn">Download Stitched Image</button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
