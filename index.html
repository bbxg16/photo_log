<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Photo Log Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Photo Log Editor</h1>
          <p id="statusText">No photos imported</p>
        </div>
      </header>

      <main>
        <section id="importScreen" class="screen active">
          <div id="dropZone" class="import-panel">
            <input id="fileInput" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple />
            <div class="import-copy">
              <span class="import-icon">+</span>
              <h2>Import photos</h2>
              <p>Choose up to 50 JPG, PNG, WebP, HEIC, or HEIF images for this session.</p>
              <button id="chooseFilesBtn" class="primary-btn">Choose Photos</button>
            </div>
          </div>
        </section>

        <section id="galleryScreen" class="screen">
          <div class="workspace-actions bottom-actions">
            <button id="addMoreBtn">Add Photos</button>
            <button id="editSelectedBtn" class="primary-btn">Next</button>
            <button id="goStitchBtn">Review Batch</button>
            <button id="clearBtn" class="danger-btn">Clear Session</button>
          </div>
          <div class="selection-line">
            <strong id="photoCount">0 photos</strong>
            <span id="selectedCount">0 selected, recommended up to 15</span>
          </div>
          <div id="gallery" class="gallery" aria-live="polite"></div>
        </section>

        <section id="editorScreen" class="screen editor-screen">
          <div class="editor-toolbar">
            <span id="editorPosition">0 / 0</span>
            <div class="crop-toolbar" aria-label="Crop and rotate controls">
              <button id="rotateBtn" type="button">Rotate</button>
              <button type="button" data-crop-ratio="original" class="active">Original</button>
              <button type="button" data-crop-ratio="4:3">4:3</button>
              <button type="button" data-crop-ratio="1:1">1:1</button>
              <button type="button" data-crop-ratio="16:9">16:9</button>
            </div>
          </div>

          <div class="editor-layout">
            <div class="editor-stage">
              <div class="photo-nav-row">
                <button id="prevPhotoBtn" aria-label="Back">Back</button>
                <button id="nextPhotoBtn" aria-label="Next photo">Next</button>
              </div>
              <div id="canvasWrap" class="canvas-wrap">
                <canvas id="photoCanvas"></canvas>
              </div>
            </div>

            <aside class="text-panel">
              <div class="text-edit-controls">
                <button id="addTextBtn" class="primary-btn wide">Add</button>

                <label class="field-label" for="fontFamily">Font</label>
                <select id="fontFamily" class="font-select">
                  <option value='Arial, "PingFang SC", "Microsoft YaHei", sans-serif'>Sans</option>
                  <option value='Georgia, "Songti SC", SimSun, serif'>Serif</option>
                  <option value='"Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif'>Soft</option>
                  <option value='"Comic Sans MS", "Marker Felt", "STKaiti", KaiTi, cursive'>Handwritten</option>
                  <option value='"Courier New", "Microsoft YaHei", monospace'>Mono</option>
                </select>

                <label class="field-label" for="fontSize">Font size</label>
                <input id="fontSize" class="font-size-input" type="number" min="10" max="180" value="36" step="1" inputmode="numeric" />

                <div class="field-label">Text color</div>
                <div class="color-row">
                  <div id="colorControls" class="swatches"></div>
                  <label class="more-color" title="More colors">
                    <input id="moreColor" type="color" value="#ffffff" />
                    <span>More</span>
                  </label>
                </div>

                <div class="field-label">Background</div>
                <div id="backgroundControls" class="segmented">
                  <button data-bg="none" class="active">None</button>
                  <button data-bg="white">White</button>
                  <button data-bg="black">Black</button>
                </div>
              </div>

            </aside>
          </div>
        </section>

        <section id="stitchScreen" class="screen">
          <div class="selection-line">
            <strong id="stitchCount">0 images</strong>
            <span>Drag to reorder. Tap an image row to edit text.</span>
          </div>
          <div id="stitchList" class="stitch-list"></div>
          <div class="stitch-download">
            <button id="backToPoolBtn">Back To Remaining Images</button>
            <button id="backToEditBtn">Back To Edit</button>
            <button id="exportStitchBtn" class="primary-btn">Stitch & Download</button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
